<a
  class="sr-only focus:not-sr-only focus:absolute focus:left-3 focus:top-3 focus:z-50 focus:rounded-[var(--radius-md)] focus:bg-[var(--surface-1)] focus:px-3 focus:py-2 focus:text-sm focus:shadow-[var(--shadow-2)]"
  [href]="'#contenido'"
>
  {{ 'app.skipToContent' | t }}
</a>

<div class="flex min-h-dvh flex-col bg-[var(--page)] text-[var(--text-1)]">
  <header
    class="sticky top-0 z-[var(--z-nav)] w-full shrink-0 border-b border-[var(--border)] bg-[var(--surface-1)]"
  >
    <div class="public-frame flex shrink-0 items-center gap-3 py-3">
      <a routerLink="/eventos" class="flex min-w-0 items-center gap-2.5 no-underline">
        @if (clientSlug()) {
          <app-brand-mark [initials]="navInitials()" />
        } @else {
          <app-brand-mark
            src="brand/logo.png"
            darkSrc="brand/logo-white.png"
            [initials]="navInitials()"
          />
        }
        <span class="truncate text-sm font-semibold tracking-tight text-[var(--text-1)]">{{
          navName()
        }}</span>
      </a>

      <app-theme-toggle class="ml-auto shrink-0" />
    </div>
  </header>

  <main
    id="contenido"
    tabindex="-1"
    class="public-frame flex min-w-0 flex-1 flex-col py-6 sm:py-8"
  >
    <router-outlet />
  </main>

  @if (!compactChrome()) {
    <footer class="mt-auto border-t border-[var(--border)] bg-[var(--surface-1)] py-6">
      <div
        class="public-frame flex flex-col items-center gap-1 text-xs text-[var(--text-3)] sm:flex-row sm:justify-between"
      >
        <p>© {{ year() }} {{ navName() }}</p>
        <p>{{ 'app.supportCodeHint' | t }}</p>
      </div>
    </footer>
  }
</div>
