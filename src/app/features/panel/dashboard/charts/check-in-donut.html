<div class="donut">
  <div class="donut__ring">
    <svg viewBox="0 0 42 42" aria-hidden="true">
      <circle class="donut__track" cx="21" cy="21" r="15.9155" />
      @for (segment of segments(); track segment.id) {
        @if (segment.value > 0) {
          <circle
            [class]="'donut__segment donut__segment--' + segment.id"
            [class.is-dim]="focus() !== null && focus() !== segment.id"
            cx="21"
            cy="21"
            r="15.9155"
            pathLength="100"
            [attr.stroke-dasharray]="segment.dash"
            [attr.stroke-dashoffset]="segment.offset"
            (pointerenter)="setFocus(segment.id)"
            (pointerleave)="setFocus(null)"
          />
        }
      }
    </svg>
    <div class="donut__center" aria-live="polite">
      <span class="donut__value">{{ center().value }}</span>
      <span class="donut__label">{{ center().label | t }}</span>
    </div>
  </div>

  <ul class="chart-legend chart-legend--stacked">
    @for (segment of segments(); track segment.id) {
      <li>
        <button
          type="button"
          [class]="'legend-row legend-row--' + segment.id"
          [class.is-active]="focus() === segment.id"
          (pointerenter)="setFocus(segment.id)"
          (pointerleave)="setFocus(null)"
          (focus)="setFocus(segment.id)"
          (blur)="setFocus(null)"
        >
          <span class="legend-row__swatch" aria-hidden="true"></span>
          <span class="legend-row__label">{{ segment.label | t }}</span>
          <span class="legend-row__value">{{ segment.value.toLocaleString('es-CO') }}</span>
          <span class="legend-row__share">{{ percent(segment.percent) }}</span>
        </button>
      </li>
    }
  </ul>
</div>
