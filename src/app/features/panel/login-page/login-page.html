<main class="auth auth--bare">
  <div class="auth__stage">
    <section class="auth__intro">
      <div class="auth__lockup" aria-hidden="true">
        <app-brand-mark src="brand/logo.png" darkSrc="brand/logo-white.png" initials="SG" />
      </div>
      <p class="auth__kicker">{{ 'app.platformName' | t }}</p>
      <h1 class="auth__title">{{ 'auth.login.title' | t }}</h1>
      <p class="auth__lead">{{ 'auth.login.subtitle' | t }}</p>
    </section>

    <form [formGroup]="form" (ngSubmit)="submit()" class="auth__card" novalidate>
      @if (errorMessage(); as message) {
        <p role="alert" class="callout callout--danger">{{ message }}</p>
      }

      <div class="auth__fields">
        <div class="auth__field">
          <label for="login-email" class="auth__label">{{ 'auth.login.email' | t }}</label>
          <input
            id="login-email"
            type="email"
            formControlName="email"
            autocomplete="username"
            required
            class="field"
          />
        </div>

        <div class="auth__field">
          <label for="login-password" class="auth__label">{{ 'auth.login.password' | t }}</label>
          <div class="auth__secret">
            <input
              id="login-password"
              [type]="showPassword() ? 'text' : 'password'"
              formControlName="password"
              autocomplete="current-password"
              required
              class="field"
            />
            <button
              type="button"
              class="auth__secret-toggle"
              [attr.aria-label]="(showPassword() ? 'auth.password.hide' : 'auth.password.show') | t"
              [attr.aria-pressed]="showPassword()"
              (click)="showPassword.set(!showPassword())"
            >
              <app-icon [name]="showPassword() ? 'eye-off' : 'eye'" [size]="18" />
            </button>
          </div>
        </div>

        <button
          type="submit"
          appButton
          variant="primary"
          block
          [loading]="submitting()"
          [disabled]="form.invalid"
        >
          {{ (submitting() ? 'auth.login.submitting' : 'auth.login.submit') | t }}
        </button>
      </div>

      <!--
      <p class="auth__switch">
        {{ 'auth.login.noAccount' | t }}
        <a routerLink="/panel/signup">{{ 'auth.login.signupLink' | t }}</a>
      </p>
      -->
      <p class="auth__aside">{{ 'auth.login.forgot' | t }}</p>
    </form>
  </div>
</main>
