<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="1.75"
  stroke-linecap="round"
  stroke-linejoin="round"
  [attr.width]="size()"
  [attr.height]="size()"
  aria-hidden="true"
  focusable="false"
>
  @for (path of paths(); track $index) {
    <path [attr.d]="path" />
  }
</svg>
