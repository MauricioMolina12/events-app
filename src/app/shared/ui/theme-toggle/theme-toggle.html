<app-menu #menu>
  <button
    type="button"
    appMenuTrigger
    appButton
    variant="ghost"
    icon
    size="sm"
    [attr.aria-label]="'ui.theme.label' | t"
    [attr.title]="'ui.theme.label' | t"
  >
    <app-icon [name]="currentIcon()" [size]="18" />
  </button>
  <ng-template appMenuContent>
    <div class="menu" role="menu" [attr.aria-label]="'ui.theme.label' | t">
      @for (option of options; track option.value) {
        <button
          type="button"
          class="menu__item"
          role="menuitem"
          [class.is-active]="theme.preference() === option.value"
          (click)="select(option.value, menu)"
        >
          <app-icon [name]="option.icon" [size]="16" />
          {{ option.labelKey | t }}
          @if (theme.preference() === option.value) {
            <app-icon name="check" [size]="16" />
          }
        </button>
      }
    </div>
  </ng-template>
</app-menu>
